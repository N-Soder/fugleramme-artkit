[project]
name = "fugleramme-artkit"
version = "0.1.0"
description = "Take birds with no artwork in Fugleramme to reviewed plates, for any country"
readme = "README.md"
authors = [{ name = "N-Soder" }]
keywords = ["birds", "birdnet", "fugleramme", "natural-history", "illustration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pillow>=12.3",
]

[project.urls]
Repository = "https://github.com/N-Soder/fugleramme-artkit"
Fugleramme = "https://github.com/arnegiacomo/fugleramme"

[project.scripts]
fugart = "fugart.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fugart"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
